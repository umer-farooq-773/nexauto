name: Deploy Code on Staging Domain

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Deploy Over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script_stop: true
          script: |
            cd /var/www/vhosts/champsconsults.com/vma.champsconsults.com || exit 1

            # Pull latest code
            git fetch origin staging
            git reset --hard origin/staging

            # Clear caches
            /opt/plesk/php/8.2/bin/php artisan optimize:clear
            /opt/plesk/php/8.2/bin/php artisan config:clear
            /opt/plesk/php/8.2/bin/php artisan cache:clear
            /opt/plesk/php/8.2/bin/php artisan route:clear
            /opt/plesk/php/8.2/bin/php artisan view:clear

            /opt/plesk/php/8.2/bin/php artisan optimize
